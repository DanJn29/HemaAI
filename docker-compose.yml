services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      TEST_DB_NAME: ${TEST_DB_NAME:?TEST_DB_NAME must be set in .env}
    ports:
      - "${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT must be set in .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set in .env} -d ${POSTGRES_DB:?POSTGRES_DB must be set in .env}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TEST_DB_HOST: db
      TEST_DB_PORT: 5432
      TEST_DB_NAME: ${TEST_DB_NAME:?TEST_DB_NAME must be set in .env}
      TEST_DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      TEST_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
      OCR_SPACE_ENDPOINT: ${OCR_SPACE_ENDPOINT:-https://api.ocr.space/parse/image}
      OCR_SPACE_ENGINE: ${OCR_SPACE_ENGINE:-2}
      OCR_SPACE_TIMEOUT_SECONDS: ${OCR_SPACE_TIMEOUT_SECONDS:-30}
      OCR_MAX_FILE_SIZE_MB: ${OCR_MAX_FILE_SIZE_MB:-5}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.seed_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_API_BASE_URL: /api/v1
      FRONTEND_API_PROXY_TARGET: http://api:8000
      FRONTEND_PORT: ${FRONTEND_PORT:-5174}
    ports:
      - "${FRONTEND_PORT:-5174}:${FRONTEND_PORT:-5174}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT:-5174}"

volumes:
  pgdata:
  frontend_node_modules:
